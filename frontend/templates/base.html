        },
      },
    }
  </script>

<body class="h-full bg-surface-50 text-surface-800 antialiased">
  <div class="flex h-full">

    <!-- ===== SIDEBAR ===== -->
    <aside class="flex w-64 flex-col border-r border-surface-200 bg-surface-900 text-surface-200">

      <!-- Brand -->
      <div class="flex flex-col gap-0.5 border-b border-surface-700 px-5 py-5">
        <span class="text-lg font-bold tracking-tight text-white">MachineryPro AI</span>
        <span class="text-xs text-surface-300">Engineering Intelligence for Manufacturing</span>
      </div>

      <!-- Navigation -->
      <nav class="flex-1 overflow-y-auto px-3 py-4">
        <ul class="space-y-1">
          {% for item in nav_items %}
          <li>
            <a href="{{ item.href }}"
               class="group flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition
                      {% if item.href == active_href %}
                        bg-brand-700 text-white
                      {% else %}
                        text-surface-300 hover:bg-surface-800 hover:text-white
                      {% endif %}">
              <span class="icon icon-{{ item.icon }} shrink-0"></span>
              <span class="truncate">{{ item.label }}</span>
              {% if item.badge %}
              <span class="ml-auto rounded-full bg-surface-700 px-2 py-0.5 text-[10px] font-semibold
                           uppercase tracking-wider text-surface-300">{{ item.badge }}</span>
              {% endif %}
            </a>
          </li>
          {% endfor %}
        </ul>
      </nav>

      <!-- Status footer -->
      <div class="border-t border-surface-700 px-5 py-4">
        <div class="flex items-center gap-2">
          <span class="h-2 w-2 rounded-full bg-emerald-400"></span>
          <span class="text-xs font-medium uppercase tracking-wider text-emerald-400">
            Engineering Core Online
          </span>
        </div>
        <p class="mt-1 text-[10px] text-surface-300">v0.1.0 · Deterministic-First</p>
      </div>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="flex-1 overflow-y-auto">
      <div class="mx-auto max-w-7xl px-6 py-8 lg:px-10">
        {% block content %}{% endblock %}
      </div>
    </main>

  </div>
</body>
</html>
